<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLH | إدارة المنصة v0.6.41</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f3f6f9;color:#203244}.head{background:#10263d;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}aside{background:#172f48;padding:14px;display:flex;flex-direction:column;gap:7px}aside button{background:transparent;color:#e8f1f8;text-align:right;border:0;padding:12px;border-radius:8px;cursor:pointer;font:inherit}aside button.active,aside button:hover{background:#245274}main{padding:22px;min-width:0}.card{background:white;border:1px solid #e0e8ef;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-size:13px;font-weight:bold}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd6df;border-radius:7px;margin-top:5px;font:inherit}button.primary{background:#1769aa;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button.small{padding:6px 10px;margin:2px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e5ebf0;text-align:right;vertical-align:top}.tablewrap{overflow:auto}.muted{color:#718092}.hide{display:none}.notice{background:#fff4dd;padding:10px;border-radius:8px;margin-bottom:10px}#login{max-width:500px;margin:50px auto}.msg{padding:10px;background:#10263d;color:white;display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:12px}}

</style></head><body><header class="head"><b>GLH — إدارة المنصة v0.6.41</b><span><a href="/admin-access.html" style="color:white">الهيكل والصلاحيات</a>　<a href="/" style="color:white">المنصة الرئيسية</a>　<button id="logout" class="primary hide">خروج</button></span></header><div id="msg" class="msg"></div><section id="login" class="card"><h2>دخول الإدارة</h2><form id="loginForm" class="grid"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary">دخول</button></form></section><div id="app" class="layout hide"><aside id="nav"><button data-page="summary" class="active">ملخص الإدارة</button><button data-page="merchants">مراجعة التجار</button><button data-page="products">مراجعة المنتجات</button><button data-page="inquiries">استفسارات السوق</button><button data-page="connections">ربط التجار</button><button data-page="store-permissions">صلاحيات المتاجر والربط الخارجي</button><button data-page="portals">البوابات المصغرة</button><button data-page="enterprise">إدارة المؤسسات ERP</button><button data-page="payments">وسائل الدفع</button><button data-page="providers">المستثمرون والمهنيون</button><button data-page="donations">التبرعات</button><button data-page="debts">الديون والتحصيل</button><div class="nav-group-label">الشراكات والتمكين الصناعي</div><button data-page="donor-directory" class="nav-feature"><span class="nav-emoji">👥</span><span>إدارة المانحين<small>ملفات الجهات والاعتماد</small></span></button><button data-page="donor-programs">📑 برامج وفرص المانحين</button><button data-page="donor-applications">🗂️ طلبات المنح ومراجعتها</button><button data-page="manufacturers" class="nav-feature"><span class="nav-emoji">🏭</span><span>إدارة المصنعين<small>ملفات المصانع والاعتماد</small></span></button><button data-page="manufacturer-catalog">📦 كتالوج المنتجات الصناعية</button><button data-page="manufacturer-inquiries">📨 طلبات عروض الأسعار والعينات</button><div class="nav-group-label">الإدارة التشغيلية المتكاملة</div>
<button data-page="advanced-operations">🧭 الوحدات التشغيلية المتقدمة</button>
<button data-page="ops-investors">👥 المستثمرون ومقدمو الخدمات</button>
<button data-page="ops-donations">🎁 التبرعات والحملات</button>
<button data-page="ops-debts">💳 الديون والتحصيل</button>
<button data-page="ops-erp">🏢 موارد المؤسسة ERP</button>

<button data-page="delivery-ops">🚚 إدارة التوصيل</button></aside><main><div id="content"></div></main></div><script src="/glh-api.js"></script><script>
const $=s=>document.querySelector(s),msg=t=>{const e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)},api=GLHApi.request;
async function initializeAdmin(){try{$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#logout').classList.remove('hide');const me=await api('/access/my-permissions');const granted=Array.isArray(me.permissions)?me.permissions:[];document.querySelectorAll('[data-page]').forEach(b=>{const needed={summary:'workspace.view',merchants:'merchants.review',products:'products.moderate',inquiries:'products.view',connections:'merchant.connections.view','store-permissions':'merchant.connections.manage',portals:'merchant.portals.view',enterprise:'enterprise.view',payments:'payments.methods.view',providers:'providers.manage',donations:'donations.view',debts:'debts.view','donor-directory':'donors.manage','donor-programs':'donors.manage','donor-applications':'donors.manage','manufacturers':'manufacturers.manage','manufacturer-catalog':'manufacturers.manage','manufacturer-inquiries':'manufacturers.manage','ops-investors':'providers.manage','ops-donations':'donations.view','ops-debts':'debts.view','ops-erp':'enterprise.view','ops-portals':'merchant.portals.view','delivery-ops':'services.manage','reports-ops':'workspace.view','integrations-ops':'integrations.view','advanced-operations':'workspace.view'}[b.dataset.page];b.hidden=!(me.all||granted.includes(needed))});const requested=new URLSearchParams(location.search).get('section');const allowed=['summary','merchants','products','inquiries','connections','store-permissions','portals','enterprise','payments','providers','donations','debts','donor-directory','donor-programs','donor-applications','manufacturers','manufacturer-catalog','manufacturer-inquiries','ops-investors','ops-donations','ops-debts','ops-erp','ops-portals','delivery-ops','reports-ops','integrations-ops','advanced-operations'];const page=allowed.includes(requested)?requested:'summary';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));await load(page)}catch(x){$('#login').classList.remove('hide');$('#app').classList.add('hide');msg(x.message)}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await GLHApi.login(d.username,d.password);if(!['ADMIN','OPS','FINANCE'].includes(r.user.role))throw Error('هذا الحساب لا يملك صلاحية الإدارة');await initializeAdmin()}catch(x){msg(x.message)}};
if(GLHApi.isAuthenticated())initializeAdmin();
$('#logout').onclick=()=>{GLHApi.logout();location.reload()};$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));load(b.dataset.page)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(page){
const aliases={'ops-investors':'providers','ops-donations':'donations','ops-debts':'debts','ops-erp':'enterprise','ops-portals':'portals'};
if(aliases[page])page=aliases[page];
document.querySelectorAll('#nav [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const c=$('#content');c.innerHTML='<div class="card">جارٍ التحميل...</div>';
if(page==='advanced-operations'){
  c.innerHTML=`<div class="card" style="padding:0;overflow:hidden">
    <div style="padding:12px 16px;background:#f7fafc;border-bottom:1px solid #e2e8ee;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <div><b>الوحدات التشغيلية المتقدمة</b><div class="muted">مساحة تشغيلية مدمجة ضمن إدارة المنصة</div></div>
      <a href="/admin-business.html?section=advanced-operations">إدارة الوحدات التشغيلية</a>
    </div>
    <iframe title="الوحدات التشغيلية المتقدمة" src="./admin-operations.html?embedded=1" style="display:block;width:100%;height:calc(100vh - 190px);min-height:680px;border:0;background:#f1f5f8"></iframe>
  </div>`;
  return;
}
try{
if(page==='summary'){const x=await api('/business/admin/summary');const cards=[['تجار بانتظار الاعتماد',x.merchantsPending],['منتجات بانتظار النشر',x.productsPending],['طلبات ربط التجار',x.connectionsPending],['بوابات مصغرة بانتظار الاعتماد',x.portalsPending],['استفسارات سوق جديدة',x.inquiriesNew],['المؤسسات المسجلة',x.organizations],['وسائل الدفع المفعلة',x.paymentMethods],['مزودون بانتظار التحقق',x.providersPending]];c.innerHTML=`<div class="card"><h2>ملخص إدارات المنصة</h2><p class="muted">المؤشرات التالية مستخرجة من قاعدة البيانات التشغيلية.</p><div class="grid">${cards.map(([n,v])=>`<div class="card"><div class="muted">${n}</div><h2>${v}</h2></div>`).join('')}</div></div><div class="card"><h3>حالة اتصال قاعدة البيانات</h3><div id="dbStatus">جارٍ فحص الاتصال...</div><button class="primary small" onclick="checkGLHDatabase()">إعادة فحص الاتصال</button></div><div class="card"><h3>روابط العمل</h3><p><a href="/marketplace.html">واجهة السوق للعملاء</a>　|　<a href="/merchant.html">بوابة العميل والتاجر</a>　|　<a href="/admin-access.html">الهيكل والصلاحيات</a></p></div>`}
else if(page==='inquiries'){const rows=await api('/business/admin/marketplace/inquiries');c.innerHTML=`<div class="card"><h2>استفسارات العملاء على منتجات التجار</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>المنتج</th><th>العميل</th><th>التاجر</th><th>الكمية</th><th>الحالة</th><th>الرسالة</th></tr>${rows.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.product.name)}</td><td>${esc(x.customer.fullName)}</td><td>${esc(x.merchant.fullName)}</td><td>${x.quantity}</td><td>${x.status}</td><td>${esc(x.message||'')}</td></tr>`).join('')}</table></div></div>`}
if(page==='merchants'){const rows=await api('/business/admin/merchants');c.innerHTML=`<div class="card"><h2>طلبات تسجيل التجار</h2><div class="tablewrap"><table><tr><th>التاجر</th><th>النشاط</th><th>السجل</th><th>الدولة/المدينة</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.user.fullName)}<br>${esc(x.user.email||'')}</td><td>${esc(x.businessName)}<br>${esc(x.businessType)}</td><td>${esc(x.registrationNumber)}</td><td>${esc(x.country)} / ${esc(x.city)}</td><td>${x.status}</td><td><button class="primary small" onclick="reviewMerchant('${x.id}','APPROVED')">اعتماد</button><button class="primary small" onclick="reviewMerchant('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='connections'){const rows=await api('/business/admin/connections');c.innerHTML=`<div class="card"><h2>طلبات ربط التجار بالمنصة</h2><div class="tablewrap"><table><tr><th>معرف التاجر</th><th>نوع الربط</th><th>رابط المتجر</th><th>النطاقات المطلوبة</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${x.merchantUserId}</td><td>${x.integrationType}</td><td>${esc(x.externalStoreUrl||'')}</td><td>${esc((x.requestedScopes||[]).join(', '))}</td><td>${x.status}</td><td><button class="primary small" onclick="reviewConnection('${x.id}','APPROVED')">اعتماد</button><button class="primary small" onclick="reviewConnection('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='store-permissions'){const rows=await api('/business/admin/stores');const integrations=await api('/management/integrations');c.innerHTML=`<div class="card"><h2>صلاحيات المتاجر والربط الخارجي</h2><p class="muted">فعّل رفع المنتجات لكل متجر بشكل مستقل، أو اربطه بمنصة تجارة خارجية. لا يتم مزامنة المنتجات فعلياً إلا بعد تطوير موصل المنصة وتوفير بيانات الاعتماد.</p><div class="tablewrap"><table><tr><th>المتجر</th><th>التاجر</th><th>عدد المنتجات</th><th>السماح برفع المنتجات</th><th>رابط المتجر الخارجي</th><th>منصة خارجية</th><th>جهة التكامل</th><th>حفظ</th></tr>${rows.map(x=>`<tr data-store="${x.id}"><td>${esc(x.name)}</td><td>${esc(x.owner?.fullName)}</td><td>${x._count?.products||0}</td><td><input type="checkbox" class="can-add" ${x.merchantCanAddProducts?'checked':''}></td><td><input class="external-url" value="${esc(x.externalStoreUrl||'')}" placeholder="https://..."></td><td><input class="external-platform" value="${esc(x.externalPlatform||'')}" placeholder="Shopify / WooCommerce"></td><td><select class="integration-id"><option value="">بدون ربط</option>${integrations.map(i=>`<option value="${i.id}" ${x.externalIntegrationId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></td><td><button class="primary small" onclick="saveStorePermission(this)">حفظ</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='products'){const rows=await api('/business/admin/products/pending');c.innerHTML=`<div class="card"><h2>المنتجات بانتظار النشر</h2><div class="tablewrap"><table><tr><th>المنتج</th><th>المتجر</th><th>التاجر</th><th>السعر</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.description||'')}</td><td>${esc(x.store?.name)}</td><td>${esc(x.store?.owner?.fullName)}</td><td>${x.price} ${x.currency}</td><td><button class="primary small" onclick="reviewProduct('${x.id}','APPROVED')">موافقة ونشر</button><button class="primary small" onclick="reviewProduct('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}

else if(page==='reports-ops'){const params=new URLSearchParams(location.hash.replace(/^#/,''));const q=params.toString();const x=await api('/operations/admin/reports/operations'+(q?'?'+q:''));c.innerHTML=`<div class="card"><h2>التقارير التشغيلية حسب الإدارة</h2><form id="reportFilter" class="grid"><label>من تاريخ<input type="date" name="from" value="${esc(params.get('from')||'')}"></label><label>إلى تاريخ<input type="date" name="to" value="${esc(params.get('to')||'')}"></label><label>الحالة<input name="status" value="${esc(params.get('status')||'')}" placeholder="SUBMITTED"></label><label>العملة<input name="currency" value="${esc(params.get('currency')||'')}" placeholder="USD"></label><label>الإدارة<select name="department"><option value="ALL">كل الإدارات</option><option value="ECOMMERCE" ${params.get('department')==='ECOMMERCE'?'selected':''}>التجارة الإلكترونية</option><option value="FINANCE" ${params.get('department')==='FINANCE'?'selected':''}>التمويل</option><option value="DELIVERY" ${params.get('department')==='DELIVERY'?'selected':''}>التوصيل</option></select></label><button class="primary">تطبيق الفلاتر</button><button type="button" class="primary" onclick="location.hash='';load('reports-ops')">مسح</button></form><div class="grid">${Object.entries({المانحون:x.donors,المصنعون:x.manufacturers,'جهات التوصيل':x.deliveryProviders,'طلبات التجارة':x.ecommerceOrders,'طلبات تمويل التجارة':x.financeOrders,'طلبات التوصيل':x.deliveryOrders}).map(([k,v])=>`<div class="card"><b>${k}</b><h2>${v}</h2></div>`).join('')}</div><h3>تفاصيل الطلبات</h3><div class="tablewrap"><table><tr><th>المرجع</th><th>الإدارة</th><th>قيمة البضاعة</th><th>التوصيل</th><th>الإجمالي</th><th>العملة</th><th>الحالة</th><th>التاريخ</th></tr>${(x.orders||[]).map(o=>`<tr><td>${esc(o.reference)}</td><td>تجارة إلكترونية</td><td>${o.productSubtotal}</td><td>${o.deliveryFee}</td><td>${o.totalAmount}</td><td>${esc(o.currency)}</td><td>${esc(o.status)}</td><td>${new Date(o.createdAt).toLocaleDateString('ar')}</td></tr>`).join('')}</table></div><p class="muted">التقارير تعرض البيانات المتاحة في مصادرها الحالية؛ لا تظهر سجلات إدارة أخرى قبل ربطها بمصدر بياناتها.</p></div>`;$('#reportFilter').onsubmit=e=>{e.preventDefault();const p=new URLSearchParams(Object.fromEntries([...new FormData(e.target)].filter(([k,v])=>v)));location.hash=p.toString();load('reports-ops')}}
}catch(e){const message=e?.message||'تعذر تحميل بيانات الوحدة';const isDenied=/صلاحية|permission|403/i.test(message);c.innerHTML=`<section class="workspace-error"><h2>${isDenied?'لا توجد صلاحية لفتح هذه الوحدة':'تعذر تحميل بيانات الوحدة'}</h2><p>${esc(message)}</p><p>تحقق من تسجيل الدخول، وصلاحية الوحدة (donors.manage أو manufacturers.manage)، واتصال قاعدة البيانات. لم يتم إنشاء سجلات تجريبية محلية.</p><div class="error-actions"><button class="primary" onclick="load('${page}')">إعادة المحاولة</button><a class="primary" style="padding:10px 14px;border-radius:7px;color:white;text-decoration:none" href="/admin-business.html">العودة إلى إدارة المنصة</a><a class="primary" style="padding:10px 14px;border-radius:7px;color:white;text-decoration:none" href="/admin-access.html">مراجعة الصلاحيات</a></div></section>`}}

window.reviewDonorApp=async(id)=>{try{const status=document.getElementById('da-'+id).value;const reviewerNotes=prompt('ملاحظات المراجع (اختياري)')||'';await api('/operations/admin/donor-applications/'+id+'/review',{method:'PATCH',body:{status,reviewerNotes}});msg('تم تحديث طلب المنحة');load('donor-applications')}catch(e){msg(e.message)}};window.respondMakerInquiry=async(id)=>{try{const quotationAmount=document.getElementById('quote-'+id).value;const status=document.getElementById('qstatus-'+id).value;await api('/operations/admin/manufacturer-inquiries/'+id+'/quote',{method:'PATCH',body:{status,...(quotationAmount?{quotationAmount:Number(quotationAmount)}:{})}});msg('تم تحديث رد المصنع');load('manufacturer-inquiries')}catch(e){msg(e.message)}};window.setDirectoryStatus=async(kind,id,status)=>{try{await api('/operations/admin/'+kind+'/'+id+'/status',{method:'PATCH',body:{status}});msg('تم تحديث الحالة');load(kind==='donors'?'donor-directory':'manufacturers')}catch(e){msg(e.message)}};

window.reviewConnection=async(id,status)=>{try{await api('/business/admin/connections/'+id+'/approve',{method:'PATCH',body:{status,approvedScopes:['PRODUCT_READ','PRODUCT_WRITE','ORDER_READ','ORDER_UPDATE','INVENTORY_READ']}});msg('تم تحديث طلب الربط');load('connections')}catch(e){msg(e.message)}};window.viewOrganization=async(id)=>{try{const x=await api('/business/organizations/'+id);const c=$('#content');c.innerHTML=`<div class="card"><h2>${esc(x.name)} — ملف الجهة</h2><p>${esc(x.legalName||'')} | ${esc(x.organizationType)} | ${esc(x.country)} / ${esc(x.city||'')}</p><div class="grid"><div><h3>إضافة إدارة / قسم</h3><form id="unitForm" class="grid"><label>اسم الوحدة<input name="name" required></label><label>نوع الوحدة<input name="unitType" required></label><label>المسؤول<input name="managerName"></label><label>الموقع<input name="location"></label><button class="primary">إضافة</button></form></div><div><h3>إضافة موظف</h3><form id="employeeForm" class="grid"><label>الاسم<input name="fullName" required></label><label>الرقم الوظيفي<input name="employeeNo"></label><label>المسمى الوظيفي<input name="jobTitle"></label><label>القسم<input name="department"></label><label>الهاتف<input name="phone"></label><label>الراتب<input name="salary" type="number"></label><button class="primary">إضافة</button></form></div><div><h3>تسجيل أصل</h3><form id="assetForm" class="grid"><label>اسم الأصل<input name="name" required></label><label>نوع الأصل<input name="assetType" required></label><label>رمز الأصل<input name="assetCode"></label><label>الرقم التسلسلي<input name="serialNumber"></label><label>الموقع<input name="location"></label><label>قيمة الشراء<input name="purchaseCost" type="number"></label><button class="primary">إضافة</button></form></div></div></div><div class="card"><h3>الوحدات التنظيمية</h3>${x.units.map(a=>`<div class="row">${esc(a.name)} — ${esc(a.unitType)} — ${esc(a.managerName||'')}</div>`).join('')||'لا توجد وحدات'}<h3>الموظفون</h3>${x.employees.map(a=>`<div class="row">${esc(a.fullName)} — ${esc(a.jobTitle||'')} — ${esc(a.department||'')}</div>`).join('')||'لا يوجد موظفون'}<h3>الأصول</h3>${x.assets.map(a=>`<div class="row">${esc(a.name)} — ${esc(a.assetType)} — ${esc(a.location||'')}</div>`).join('')||'لا توجد أصول'}<button class="primary" onclick="load('enterprise')">عودة</button></div>`;for(const [form,route,convert] of [['unitForm','units',d=>d],['employeeForm','employees',d=>{if(d.salary==='')delete d.salary;else d.salary=Number(d.salary);return d}],['assetForm','assets',d=>{if(d.purchaseCost==='')delete d.purchaseCost;else d.purchaseCost=Number(d.purchaseCost);return d}]])$('#'+form).onsubmit=async e=>{e.preventDefault();const d=convert(Object.fromEntries(new FormData(e.target)));try{await api('/business/organizations/'+id+'/'+route,{method:'POST',body:d});msg('تم حفظ بيانات الجهة');viewOrganization(id)}catch(err){msg(err.message)}}}catch(e){msg(e.message)}};window.reviewMerchant=async(id,status)=>{try{await api('/business/admin/merchants/'+id+'/review',{method:'PATCH',body:{status}});msg('تم تحديث حالة التاجر');load('merchants')}catch(e){msg(e.message)}};window.verifyProvider=async(id,status)=>{try{await api('/business/admin/providers/'+id+'/status',{method:'PATCH',body:{status}});msg('تم تحديث حالة المزود');load('providers')}catch(e){msg(e.message)}};window.setDonation=async(id,status)=>{try{await api('/business/admin/donations/'+id+'/status',{method:'PATCH',body:{status}});msg('تم تحديث التبرع');load('donations')}catch(e){msg(e.message)}};window.confirmDebtPayment=async(id,status)=>{try{await api('/business/admin/debt-payments/'+id+'/confirm',{method:'PATCH',body:{status}});msg('تم تحديث طلب السداد');load('debts')}catch(e){msg(e.message)}};window.reviewPortal=async(id,status)=>{try{await api('/business/admin/portals/'+id+'/review',{method:'PATCH',body:{status}});msg('تم تحديث حالة البوابة');load('portals')}catch(e){msg(e.message)}};window.reviewProduct=async(id,decision)=>{try{await api('/business/admin/products/'+id+'/review',{method:'PATCH',body:{decision}});msg('تم تحديث قرار المنتج');load('products')}catch(e){msg(e.message)}};

window.exportWorkspaceTable=(tableId,filename)=>{const t=document.getElementById(tableId);if(!t)return;const csv=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/"/g,'""').replace(/\n/g,' ')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)};
function bindWorkspaceFilters(searchId,statusId,tableId){const run=()=>{const q=(document.getElementById(searchId)?.value||'').toLowerCase(),st=document.getElementById(statusId)?.value||'',t=document.getElementById(tableId);if(!t)return;[...t.rows].slice(1).forEach(r=>{const txt=r.innerText.toLowerCase(),status=r.cells[r.cells.length-2]?.innerText||'';r.hidden=!(txt.includes(q)&&(!st||status.includes(st)))})};document.getElementById(searchId)?.addEventListener('input',run);document.getElementById(statusId)?.addEventListener('change',run)}
</script></body></html>
