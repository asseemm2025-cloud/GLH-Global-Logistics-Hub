<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLH | إدارة الأعمال والخدمات</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f3f6f9;color:#203244}.head{background:#10263d;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}aside{background:#172f48;padding:14px;display:flex;flex-direction:column;gap:7px}aside button{background:transparent;color:#e8f1f8;text-align:right;border:0;padding:12px;border-radius:8px;cursor:pointer;font:inherit}aside button.active,aside button:hover{background:#245274}main{padding:22px;min-width:0}.card{background:white;border:1px solid #e0e8ef;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-size:13px;font-weight:bold}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd6df;border-radius:7px;margin-top:5px;font:inherit}button.primary{background:#1769aa;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button.small{padding:6px 10px;margin:2px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e5ebf0;text-align:right;vertical-align:top}.tablewrap{overflow:auto}.muted{color:#718092}.hide{display:none}.notice{background:#fff4dd;padding:10px;border-radius:8px;margin-bottom:10px}#login{max-width:500px;margin:50px auto}.msg{padding:10px;background:#10263d;color:white;display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style></head><body><header class="head"><b>GLH — إدارة الأعمال والخدمات v0.6.12</b><span><a href="/admin-access.html" style="color:white">الهيكل والصلاحيات</a>　<a href="/" style="color:white">المنصة الرئيسية</a>　<button id="logout" class="primary hide">خروج</button></span></header><div id="msg" class="msg"></div><section id="login" class="card"><h2>دخول الإدارة</h2><form id="loginForm" class="grid"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary">دخول</button></form></section><div id="app" class="layout hide"><aside id="nav"><button data-page="summary" class="active">ملخص الإدارة</button><button data-page="merchants">مراجعة التجار</button><button data-page="products">مراجعة المنتجات</button><button data-page="inquiries">استفسارات السوق</button><button data-page="connections">ربط التجار</button><button data-page="portals">البوابات المصغرة</button><button data-page="enterprise">إدارة المؤسسات ERP</button><button data-page="payments">وسائل الدفع</button><button data-page="providers">المستثمرون والمهنيون</button><button data-page="donations">التبرعات</button><button data-page="debts">الديون والتحصيل</button></aside><main><div id="content"></div></main></div><script src="/glh-api.js"></script><script>
const $=s=>document.querySelector(s),msg=t=>{const e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)},api=GLHApi.request;
$('#loginForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await GLHApi.login(d.username,d.password);if(!['ADMIN','OPS','FINANCE'].includes(r.user.role))throw Error('هذا الحساب لا يملك صلاحية الإدارة');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#logout').classList.remove('hide');const me=await api('/access/my-permissions');document.querySelectorAll('[data-page]').forEach(b=>{const needed={summary:'workspace.view',merchants:'merchants.review',products:'products.moderate',inquiries:'products.view',connections:'merchant.connections.view',portals:'merchant.portals.view',enterprise:'enterprise.view',payments:'payments.methods.view',providers:'providers.manage',donations:'donations.view',debts:'debts.view'}[b.dataset.page];b.hidden=!(me.all||me.permissions.includes(needed))});const requested=new URLSearchParams(location.search).get('section');const allowed=['summary','merchants','products','inquiries','connections','portals','enterprise','payments','providers','donations','debts'];load(allowed.includes(requested)?requested:'summary')}catch(x){msg(x.message)}};
$('#logout').onclick=()=>{GLHApi.logout();location.reload()};$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));load(b.dataset.page)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(page){document.querySelectorAll('#nav [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const c=$('#content');c.innerHTML='<div class="card">جارٍ التحميل...</div>';try{
if(page==='summary'){const x=await api('/business/admin/summary');const cards=[['تجار بانتظار الاعتماد',x.merchantsPending],['منتجات بانتظار النشر',x.productsPending],['طلبات ربط التجار',x.connectionsPending],['بوابات مصغرة بانتظار الاعتماد',x.portalsPending],['استفسارات سوق جديدة',x.inquiriesNew],['المؤسسات المسجلة',x.organizations],['وسائل الدفع المفعلة',x.paymentMethods],['مزودون بانتظار التحقق',x.providersPending]];c.innerHTML=`<div class="card"><h2>ملخص إدارات المنصة</h2><p class="muted">المؤشرات التالية مستخرجة من قاعدة البيانات التشغيلية.</p><div class="grid">${cards.map(([n,v])=>`<div class="card"><div class="muted">${n}</div><h2>${v}</h2></div>`).join('')}</div></div><div class="card"><h3>حالة اتصال قاعدة البيانات</h3><div id="dbStatus">جارٍ فحص الاتصال...</div><button class="primary small" onclick="checkGLHDatabase()">إعادة فحص الاتصال</button></div><div class="card"><h3>روابط العمل</h3><p><a href="/marketplace.html">واجهة السوق للعملاء</a>　|　<a href="/merchant.html">بوابة العميل والتاجر</a>　|　<a href="/admin-access.html">الهيكل والصلاحيات</a></p></div>`}
else if(page==='inquiries'){const rows=await api('/business/admin/marketplace/inquiries');c.innerHTML=`<div class="card"><h2>استفسارات العملاء على منتجات التجار</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>المنتج</th><th>العميل</th><th>التاجر</th><th>الكمية</th><th>الحالة</th><th>الرسالة</th></tr>${rows.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.product.name)}</td><td>${esc(x.customer.fullName)}</td><td>${esc(x.merchant.fullName)}</td><td>${x.quantity}</td><td>${x.status}</td><td>${esc(x.message||'')}</td></tr>`).join('')}</table></div></div>`}
if(page==='merchants'){const rows=await api('/business/admin/merchants');c.innerHTML=`<div class="card"><h2>طلبات تسجيل التجار</h2><div class="tablewrap"><table><tr><th>التاجر</th><th>النشاط</th><th>السجل</th><th>الدولة/المدينة</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.user.fullName)}<br>${esc(x.user.email||'')}</td><td>${esc(x.businessName)}<br>${esc(x.businessType)}</td><td>${esc(x.registrationNumber)}</td><td>${esc(x.country)} / ${esc(x.city)}</td><td>${x.status}</td><td><button class="primary small" onclick="reviewMerchant('${x.id}','APPROVED')">اعتماد</button><button class="primary small" onclick="reviewMerchant('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='connections'){const rows=await api('/business/admin/connections');c.innerHTML=`<div class="card"><h2>طلبات ربط التجار بالمنصة</h2><div class="tablewrap"><table><tr><th>معرف التاجر</th><th>نوع الربط</th><th>رابط المتجر</th><th>النطاقات المطلوبة</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${x.merchantUserId}</td><td>${x.integrationType}</td><td>${esc(x.externalStoreUrl||'')}</td><td>${esc((x.requestedScopes||[]).join(', '))}</td><td>${x.status}</td><td><button class="primary small" onclick="reviewConnection('${x.id}','APPROVED')">اعتماد</button><button class="primary small" onclick="reviewConnection('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='products'){const rows=await api('/business/admin/products/pending');c.innerHTML=`<div class="card"><h2>المنتجات بانتظار النشر</h2><div class="tablewrap"><table><tr><th>المنتج</th><th>المتجر</th><th>التاجر</th><th>السعر</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.description||'')}</td><td>${esc(x.store?.name)}</td><td>${esc(x.store?.owner?.fullName)}</td><td>${x.price} ${x.currency}</td><td><button class="primary small" onclick="reviewProduct('${x.id}','APPROVED')">موافقة ونشر</button><button class="primary small" onclick="reviewProduct('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`}
else if(page==='portals'){const rows=await api('/business/admin/portals');c.innerHTML=`<div class="card"><h2>طلبات البوابات المصغرة</h2><div class="tablewrap"><table><tr><th>البوابة</th><th>المتجر</th><th>المعرف</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.store?.name||'')}</td><td>${esc(x.slug)}</td><td>${x.status}</td><td><button class="primary small" onclick="reviewPortal('${x.id}','ACTIVE')">تفعيل</button><button class="primary small" onclick="reviewPortal('${x.id}','SUSPENDED')">تعليق</button><button class="primary small" onclick="reviewPortal('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`;c.innerHTML+= '<div class="card"><h3>تحديث يدوي للحالة</h3><form id="portalReview" class="grid"><label>معرف البوابة<input name="id" required></label><label>الحالة<select name="status"><option>ACTIVE</option><option>REJECTED</option><option>SUSPENDED</option></select></label><button class="primary">حفظ الحالة</button></form></div>';$('#portalReview').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/business/admin/portals/'+d.id+'/review',{method:'PATCH',body:{status:d.status}});msg('تم تحديث الحالة')}catch(x){msg(x.message)}}}
else if(page==='enterprise'){c.innerHTML=`<div class="card"><h2>تسجيل جهة / مؤسسة</h2><form id="orgForm" class="grid"><label>اسم الجهة<input name="name" required></label><label>الاسم القانوني<input name="legalName"></label><label>نوع الجهة<input name="organizationType" required placeholder="شركة، مؤسسة، منظمة، جهة حكومية"></label><label>رقم التسجيل<input name="registrationNumber"></label><label>الدولة<input name="country" required></label><label>المدينة<input name="city"></label><label>العنوان<input name="address"></label><label>البريد<input name="email" type="email"></label><label>الهاتف<input name="phone"></label><label>العملة<input name="currency" value="USD" maxlength="3"></label><button class="primary">حفظ الجهة</button></form></div><div class="card"><h2>الجهات المسجلة</h2><div id="orgRows"></div></div>`;const rows=await api('/business/organizations');$('#orgRows').innerHTML=rows.map(x=>`<div class="row"><b>${esc(x.name)}</b> — ${esc(x.organizationType)} — وحدات: ${x._count.units} — موظفون: ${x._count.employees} — أصول: ${x._count.assets} <button class="primary small" onclick="viewOrganization('${x.id}')">فتح الملف والتفاصيل</button></div>`).join('');$('#orgForm').onsubmit=async e=>{e.preventDefault();try{await api('/business/organizations',{method:'POST',body:Object.fromEntries(new FormData(e.target))});msg('تم تسجيل الجهة');load('enterprise')}catch(x){msg(x.message)}}}
else if(page==='payments'){const rows=await api('/business/admin/payment-methods'),transactions=await api('/business/admin/payment-transactions');c.innerHTML=`<div class="card"><h2>إضافة وسيلة دفع</h2><form id="payForm" class="grid"><label>رمز فريد<input name="code" required placeholder="YEMEN_WALLET"></label><label>الاسم بالعربية<input name="nameAr" required></label><label>النوع<select name="type">${['CASH','BANK_TRANSFER','CARD','MOBILE_WALLET','QR','PAYMENT_LINK','DIRECT_DEBIT','CASH_ON_DELIVERY','ESCROW','OTHER'].map(x=>`<option>${x}</option>`)}</select></label><label>مزود الخدمة<input name="providerName"></label><label>الدولة<input name="country"></label><label>عمولة ثابتة<input name="feeFixed" type="number" step="0.01"></label><label>عمولة نسبة %<input name="feePercent" type="number" step="0.01"></label><label>مدة التسوية<input name="settlementPeriod" placeholder="T+1"></label><button class="primary">إضافة</button></form></div><div class="card"><h2>وسائل الدفع (${rows.length})</h2>${rows.map(x=>`<div>${esc(x.code)} — ${esc(x.nameAr)} — ${x.type} — ${esc(x.providerName||'')} — ${x.enabled?'مفعلة':'موقوفة'} <button class="primary small" onclick="togglePaymentMethod('${x.id}',${!x.enabled})">${x.enabled?'إيقاف':'تفعيل'}</button></div>`).join('')}</div><div class="card"><h2>سجل عمليات الدفع (طلبات الدفع)</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>المبلغ</th><th>العملة</th><th>الوسيلة</th><th>الحالة</th><th>التاريخ</th></tr>${transactions.map(x=>`<tr><td>${x.reference}</td><td>${x.amount}</td><td>${x.currency}</td><td>${esc(x.paymentMethod.nameAr)}</td><td>${x.status}</td><td>${new Date(x.createdAt).toLocaleString('ar')}</td></tr>`).join('')}</table></div><p class="muted">هذه سجلات طلبات الدفع؛ لا تعني أن الخصم أو التحصيل قد تم.</p></div>`;$('#payForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k of ['feeFixed','feePercent'])if(d[k]==='')delete d[k];else d[k]=Number(d[k]);try{await api('/business/admin/payment-methods',{method:'POST',body:d});msg('تمت إضافة وسيلة الدفع');load('payments')}catch(x){msg(x.message)}}}
else if(page==='providers'){const cats=['INVESTOR','DONOR','LENDER','DEBT_COLLECTOR','LAWYER','CHINA_MARKET_BROKER'],rows=await api('/business/admin/providers');c.innerHTML=`<div class="card"><h2>تسجيل مزود خدمة متخصص</h2><form id="providerForm" class="grid"><label>الفئة<select name="category">${cats.map(x=>`<option>${x}</option>`)}</select></label><label>الاسم / الجهة<input name="name" required></label><label>اسم المؤسسة<input name="organizationName"></label><label>الدولة<input name="country"></label><label>المدينة<input name="city"></label><label>اسم المسؤول<input name="contactName"></label><label>البريد<input name="email" type="email"></label><label>الهاتف<input name="phone"></label><label>الموقع<input name="website" type="url"></label><label>رقم الترخيص<input name="licenseNumber"></label><button class="primary">تسجيل للمراجعة</button></form></div><div class="card"><h2>مزودو الخدمات والتحقق</h2><div class="tablewrap"><table><tr><th>الجهة</th><th>الفئة</th><th>الدولة</th><th>الترخيص</th><th>الحالة</th><th>الإجراء</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.category}</td><td>${esc(x.country||'')}</td><td>${esc(x.licenseNumber||'')}</td><td>${x.status}</td><td><button class="primary small" onclick="verifyProvider('${x.id}','VERIFIED')">توثيق</button><button class="primary small" onclick="verifyProvider('${x.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`;$('#providerForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/business/admin/providers',{method:'POST',body:d});msg('تم تسجيل المزود بانتظار التحقق');load('providers')}catch(x){msg(x.message)}};const opps=await api('/business/admin/investment-opportunities'),apps=await api('/business/admin/investment-applications');c.innerHTML+=`<div class="card"><h2>إدارة الفرص الاستثمارية</h2><form id="oppForm" class="grid"><label>رمز الفرصة<input name="code" required></label><label>اسم الفرصة<input name="title" required></label><label>القطاع<input name="sector" required></label><label>الموقع<input name="location"></label><label>المبلغ المستهدف<input name="targetAmount" type="number" min="1" required></label><label>الحد الأدنى<input name="minimumAmount" type="number"></label><label>العملة<input name="currency" value="USD"></label><label>العائد المتوقع %<input name="expectedReturnPercent" type="number"></label><label>المدة بالأشهر<input name="durationMonths" type="number"></label><label>مستوى المخاطر<input name="riskLevel"></label><label>الحالة<select name="status"><option>DRAFT</option><option>OPEN</option><option>CLOSED</option></select></label><label>الوصف<textarea name="description"></textarea></label><button class="primary">حفظ الفرصة</button></form><h3>الفرص المسجلة</h3>${opps.map(o=>`<p>${esc(o.code)} — ${esc(o.title)} — ${o.targetAmount} ${o.currency} — ${o.status} — الطلبات: ${o._count.applications}</p>`).join('')||'لا توجد فرص'}<h3>طلبات المستثمرين</h3><div class="tablewrap"><table><tr><th>المستثمر</th><th>الفرصة</th><th>المبلغ</th><th>الحالة</th><th>الإجراء</th></tr>${apps.map(a=>`<tr><td>${esc(a.applicant.fullName)}</td><td>${esc(a.opportunity.title)}</td><td>${a.requestedAmount} ${a.currency}</td><td>${a.status}</td><td><button class="primary small" onclick="reviewInvestment('${a.id}','APPROVED')">قبول مبدئي</button><button class="primary small" onclick="reviewInvestment('${a.id}','NEED_INFO')">طلب استكمال</button><button class="primary small" onclick="reviewInvestment('${a.id}','REJECTED')">رفض</button></td></tr>`).join('')}</table></div></div>`;$('#oppForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k of ['targetAmount','minimumAmount','expectedReturnPercent','durationMonths'])if(d[k]==='')delete d[k];else d[k]=Number(d[k]);try{await api('/business/admin/investment-opportunities',{method:'POST',body:d});msg('تم حفظ الفرصة الاستثمارية');load('providers')}catch(x){msg(x.message)}}}
else if(page==='donations'){const rows=await api('/business/donation-campaigns'),donations=await api('/business/admin/donations');c.innerHTML=`<div class="card"><h2>إنشاء حملة تبرعات</h2><form id="campForm" class="grid"><label>الرمز<input name="code" required></label><label>اسم الحملة<input name="title" required></label><label>المستفيد<input name="beneficiaryName"></label><label>المبلغ المستهدف<input name="targetAmount" type="number"></label><label>العملة<input name="currency" value="USD"></label><label>الحالة<select name="status"><option>DRAFT</option><option>ACTIVE</option><option>CLOSED</option></select></label><label>الوصف<textarea name="description"></textarea></label><button class="primary">حفظ الحملة</button></form></div><div class="card"><h2>الحملات النشطة</h2>${rows.map(x=>`<div>${esc(x.code)} — ${esc(x.title)} — المستلم: ${x.receivedAmount} ${x.currency}</div>`).join('')}</div><div class="card"><h2>سجل التبرعات</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>الحملة</th><th>المتبرع</th><th>المبلغ</th><th>الحالة</th><th>الإجراء</th></tr>${donations.map(x=>`<tr><td>${x.reference}</td><td>${esc(x.campaign.title)}</td><td>${esc(x.anonymous?'مجهول':x.donorName||'—')}</td><td>${x.amount} ${x.currency}</td><td>${x.status}</td><td><button class="primary small" onclick="setDonation('${x.id}','RECEIVED')">تأكيد الاستلام</button><button class="primary small" onclick="setDonation('${x.id}','ALLOCATED')">تخصيص</button></td></tr>`).join('')}</table></div></div>`;$('#campForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.targetAmount==='')delete d.targetAmount;else d.targetAmount=Number(d.targetAmount);try{await api('/business/admin/donation-campaigns',{method:'POST',body:d});msg('تم إنشاء الحملة');load('donations')}catch(x){msg(x.message)}};const alloc=await api('/business/admin/donation-allocations');c.innerHTML+=`<div class="card"><h2>تخصيص وصرف التبرعات</h2><form id="allocationForm" class="grid"><label>الحملة<select name="campaignId" required>${rows.map(a=>`<option value="${a.id}">${esc(a.code)} — ${esc(a.title)}</option>`).join('')}</select></label><label>اسم المستفيد<input name="beneficiaryName" required></label><label>الغرض من التخصيص<input name="purpose" required></label><label>المبلغ<input name="amount" type="number" min="0.01" required></label><label>العملة<input name="currency" value="USD"></label><label>ملاحظات<textarea name="notes"></textarea></label><button class="primary">تسجيل التخصيص</button></form><h3>سجل التخصيصات</h3><div class="tablewrap"><table><tr><th>الحملة</th><th>المستفيد</th><th>الغرض</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr>${alloc.map(a=>`<tr><td>${esc(a.campaign.title)}</td><td>${esc(a.beneficiaryName)}</td><td>${esc(a.purpose)}</td><td>${a.amount} ${a.currency}</td><td>${a.status}</td><td>${a.status!=='DISBURSED'?`<button class="primary small" onclick="disburseAllocation('${a.id}')">تأكيد الصرف</button>`:esc(a.receiptReference||'')}</td></tr>`).join('')}</table></div></div>`;$('#allocationForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.amount=Number(d.amount);try{await api('/business/admin/donation-allocations',{method:'POST',body:d});msg('تم تسجيل التخصيص');load('donations')}catch(x){msg(x.message)}}}
else if(page==='debts'){const rows=await api('/business/admin/debts'),payments=await api('/business/admin/debt-payments');c.innerHTML=`<div class="card"><h2>تسجيل دين</h2><form id="debtForm" class="grid"><label>اسم المدين<input name="debtorName" required></label><label>معرف حساب المدين (اختياري)<input name="debtorUserId"></label><label>هاتف المدين<input name="debtorPhone"></label><label>الدائن<input name="creditorName" required></label><label>وصف الدين<input name="description"></label><label>المبلغ الأصلي<input name="principalAmount" type="number" required></label><label>العملة<input name="currency" value="USD"></label><label>تاريخ الاستحقاق<input name="dueDate" type="date"></label><button class="primary">تسجيل الدين</button></form></div><div class="card"><h2>سجل الديون</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>المدين</th><th>الدائن</th><th>الأصل</th><th>المسدد</th><th>الحالة</th></tr>${rows.map(x=>`<tr><td>${x.reference}</td><td>${esc(x.debtorName)}</td><td>${esc(x.creditorName)}</td><td>${x.principalAmount} ${x.currency}</td><td>${x.paidAmount}</td><td>${x.status}</td></tr>`).join('')}</table></div></div><div class="card"><h2>طلبات سداد الديون</h2><div class="tablewrap"><table><tr><th>المرجع</th><th>الدين</th><th>المبلغ</th><th>الحالة</th><th>الإجراء</th></tr>${payments.map(x=>`<tr><td>${x.reference}</td><td>${x.debt.reference}</td><td>${x.amount} ${x.currency}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button class="primary small" onclick="confirmDebtPayment('${x.id}','RECEIVED')">تأكيد التحصيل</button><button class="primary small" onclick="confirmDebtPayment('${x.id}','REJECTED')">رفض</button>`:''}</td></tr>`).join('')}</table></div></div>`;$('#debtForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.principalAmount=Number(d.principalAmount);if(!d.dueDate)delete d.dueDate;try{await api('/business/admin/debts',{method:'POST',body:d});msg('تم تسجيل الدين');load('debts')}catch(x){msg(x.message)}};c.innerHTML+=`<div class="card"><h2>جدولة قسط ومتابعة التحصيل</h2><p class="muted">أدخل معرف الدين الظاهر في سجل الديون لإنشاء قسط أو تسجيل متابعة.</p><form id="installmentForm" class="grid"><label>معرف الدين<input name="debtId" required></label><label>رقم القسط<input name="installmentNo" type="number" min="1" required></label><label>تاريخ الاستحقاق<input name="dueDate" type="date" required></label><label>قيمة القسط<input name="amount" type="number" min="0.01" required></label><button class="primary">إضافة القسط</button></form><form id="collectionForm" class="grid"><label>معرف الدين<input name="debtId" required></label><label>نوع المتابعة<select name="activityType"><option>CALL</option><option>VISIT</option><option>MESSAGE</option><option>LEGAL_NOTICE</option><option>PROMISE_TO_PAY</option><option>OTHER</option></select></label><label>نتيجة التواصل<input name="result"></label><label>موعد المتابعة القادمة<input name="nextFollowUp" type="date"></label><label>المسؤول<input name="assignedTo"></label><label>ملاحظات<textarea name="notes"></textarea></label><button class="primary">حفظ متابعة التحصيل</button></form></div>`;$('#installmentForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/business/admin/debts/'+d.debtId+'/installments',{method:'POST',body:{installments:[{installmentNo:Number(d.installmentNo),dueDate:d.dueDate,amount:Number(d.amount)}]}});msg('تمت إضافة القسط');e.target.reset()}catch(x){msg(x.message)}};$('#collectionForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),id=d.debtId;delete d.debtId;if(!d.nextFollowUp)delete d.nextFollowUp;try{await api('/business/admin/debts/'+id+'/collection-activities',{method:'POST',body:d});msg('تم حفظ متابعة التحصيل');e.target.reset()}catch(x){msg(x.message)}}}
}catch(e){c.innerHTML=`<div class="card notice">تعذر تحميل القسم: ${esc(e.message)}<br>تحقق من صلاحيات الحساب واتصال قاعدة البيانات.</div>`}}
window.reviewInvestment=async(id,status)=>{try{await api('/business/admin/investment-applications/'+id+'/review',{method:'PATCH',body:{status}});msg('تم تحديث طلب الاستثمار');load('providers')}catch(e){msg(e.message)}};window.disburseAllocation=async(id)=>{const receiptReference=prompt('أدخل رقم سند الصرف');if(!receiptReference)return;try{await api('/business/admin/donation-allocations/'+id+'/disburse',{method:'PATCH',body:{receiptReference}});msg('تم تأكيد الصرف');load('donations')}catch(e){msg(e.message)}};window.togglePaymentMethod=async(id,enabled)=>{try{await api('/business/admin/payment-methods/'+id,{method:'PATCH',body:{enabled}});msg('تم تحديث حالة وسيلة الدفع');load('payments')}catch(e){msg(e.message)}};
window.checkGLHDatabase=async()=>{const el=document.querySelector('#dbStatus');if(!el)return;el.textContent='جارٍ فحص PostgreSQL...';try{const r=await GLHApi.readiness();el.textContent='متصل — '+r.database+' — '+r.version;el.style.color='#16734a'}catch(e){el.textContent='غير متصل أو غير جاهز: '+e.message;el.style.color='#a33'}};
window.reviewConnection=async(id,status)=>{try{await api('/business/admin/connections/'+id+'/approve',{method:'PATCH',body:{status,approvedScopes:['PRODUCT_READ','PRODUCT_WRITE','ORDER_READ','ORDER_UPDATE','INVENTORY_READ']}});msg('تم تحديث طلب الربط');load('connections')}catch(e){msg(e.message)}};window.viewOrganization=async(id)=>{try{const x=await api('/business/organizations/'+id);const c=$('#content');c.innerHTML=`<div class="card"><h2>${esc(x.name)} — ملف الجهة</h2><p>${esc(x.legalName||'')} | ${esc(x.organizationType)} | ${esc(x.country)} / ${esc(x.city||'')}</p><div class="grid"><div><h3>إضافة إدارة / قسم</h3><form id="unitForm" class="grid"><label>اسم الوحدة<input name="name" required></label><label>نوع الوحدة<input name="unitType" required></label><label>المسؤول<input name="managerName"></label><label>الموقع<input name="location"></label><button class="primary">إضافة</button></form></div><div><h3>إضافة موظف</h3><form id="employeeForm" class="grid"><label>الاسم<input name="fullName" required></label><label>الرقم الوظيفي<input name="employeeNo"></label><label>المسمى الوظيفي<input name="jobTitle"></label><label>القسم<input name="department"></label><label>الهاتف<input name="phone"></label><label>الراتب<input name="salary" type="number"></label><button class="primary">إضافة</button></form></div><div><h3>تسجيل أصل</h3><form id="assetForm" class="grid"><label>اسم الأصل<input name="name" required></label><label>نوع الأصل<input name="assetType" required></label><label>رمز الأصل<input name="assetCode"></label><label>الرقم التسلسلي<input name="serialNumber"></label><label>الموقع<input name="location"></label><label>قيمة الشراء<input name="purchaseCost" type="number"></label><button class="primary">إضافة</button></form></div></div></div><div class="card"><h3>الوحدات التنظيمية</h3>${x.units.map(a=>`<div class="row">${esc(a.name)} — ${esc(a.unitType)} — ${esc(a.managerName||'')}</div>`).join('')||'لا توجد وحدات'}<h3>الموظفون</h3>${x.employees.map(a=>`<div class="row">${esc(a.fullName)} — ${esc(a.jobTitle||'')} — ${esc(a.department||'')}</div>`).join('')||'لا يوجد موظفون'}<h3>الأصول</h3>${x.assets.map(a=>`<div class="row">${esc(a.name)} — ${esc(a.assetType)} — ${esc(a.location||'')}</div>`).join('')||'لا توجد أصول'}<button class="primary" onclick="load('enterprise')">عودة</button></div>`;for(const [form,route,convert] of [['unitForm','units',d=>d],['employeeForm','employees',d=>{if(d.salary==='')delete d.salary;else d.salary=Number(d.salary);return d}],['assetForm','assets',d=>{if(d.purchaseCost==='')delete d.purchaseCost;else d.purchaseCost=Number(d.purchaseCost);return d}]])$('#'+form).onsubmit=async e=>{e.preventDefault();const d=convert(Object.fromEntries(new FormData(e.target)));try{await api('/business/organizations/'+id+'/'+route,{method:'POST',body:d});msg('تم حفظ بيانات الجهة');viewOrganization(id)}catch(err){msg(err.message)}}}catch(e){msg(e.message)}};window.reviewMerchant=async(id,status)=>{try{await api('/business/admin/merchants/'+id+'/review',{method:'PATCH',body:{status}});msg('تم تحديث حالة التاجر');load('merchants')}catch(e){msg(e.message)}};window.verifyProvider=async(id,status)=>{try{await api('/business/admin/providers/'+id+'/status',{method:'PATCH',body:{status}});msg('تم تحديث حالة المزود');load('providers')}catch(e){msg(e.message)}};window.setDonation=async(id,status)=>{try{await api('/business/admin/donations/'+id+'/status',{method:'PATCH',body:{status}});msg('تم تحديث التبرع');load('donations')}catch(e){msg(e.message)}};window.confirmDebtPayment=async(id,status)=>{try{await api('/business/admin/debt-payments/'+id+'/confirm',{method:'PATCH',body:{status}});msg('تم تحديث طلب السداد');load('debts')}catch(e){msg(e.message)}};window.reviewPortal=async(id,status)=>{try{await api('/business/admin/portals/'+id+'/review',{method:'PATCH',body:{status}});msg('تم تحديث حالة البوابة');load('portals')}catch(e){msg(e.message)}};window.reviewProduct=async(id,decision)=>{try{await api('/business/admin/products/'+id+'/review',{method:'PATCH',body:{decision}});msg('تم تحديث قرار المنتج');load('products')}catch(e){msg(e.message)}};
</script></body></html>
