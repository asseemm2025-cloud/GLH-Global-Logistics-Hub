services:
  db:
    image: postgres:16-alpine
    container_name: glh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glh
      POSTGRES_USER: glh_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_this_db_password}
    ports:
      - "5432:5432"
    volumes:
      - glh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glh_user -d glh"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: glh-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://glh_user:${POSTGRES_PASSWORD:-local_only_change_this_db_password}@db:5432/glh?schema=public
      JWT_SECRET: ${JWT_SECRET:-local_only_change_this_secret_to_32_chars_minimum_123}
      JWT_EXPIRES_IN: 8h
      WEB_ORIGIN: http://localhost:4000
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe_Local_Admin_2026!}
      SEED_DEMO_DATA: "false"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  glh_pgdata:
