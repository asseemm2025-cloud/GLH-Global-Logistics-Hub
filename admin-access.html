<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLH | الهيكل الإداري والصلاحيات</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f2f5f8;color:#1e3347}.top{background:#10263d;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 58px)}aside{background:#17324d;padding:14px}aside button{width:100%;text-align:right;background:transparent;color:#fff;border:0;padding:12px;border-radius:8px;margin:3px 0;font:inherit;cursor:pointer}aside button.active,aside button:hover{background:#285777}main{padding:22px;min-width:0}.card{background:#fff;border:1px solid #dfe7ed;border-radius:12px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;margin-top:5px;font:inherit}label{font-size:13px;font-weight:bold}button.primary{background:#1769aa;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer}.muted{color:#718092}.hidden{display:none}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #e5ebf0;text-align:right;font-size:13px}th{background:#edf3f7;position:sticky;top:0}.group{background:#e8f0f6;font-weight:bold}.perm{white-space:nowrap}.msg{display:none;background:#10263d;color:#fff;padding:9px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}main{padding:10px}}
</style></head><body><header class="top"><b>GLH — الهيكل الإداري ومصفوفة الصلاحيات</b><div><a href="/admin-business.html" style="color:white">إدارة الأعمال</a>　<a href="/" style="color:white">الرئيسية</a></div></header><div id="msg" class="msg"></div><section id="login" class="card" style="max-width:520px;margin:35px auto"><h2>دخول مدير النظام</h2><form id="loginForm" class="grid"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary">دخول</button></form></section><div id="app" class="layout hidden"><aside><button class="active" data-page="matrix">مصفوفة الصلاحيات التفصيلية</button><button data-page="org">الهيكل الإداري والإدارات</button><button data-page="roles">الأدوار والمسؤوليات</button></aside><main id="content"></main></div><script src="/glh-api.js"></script><script>
const $=s=>document.querySelector(s),msg=t=>{let e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000)},api=GLHApi.request;let catalog,matrix,organization;
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target)),r=await GLHApi.login(d.username,d.password);if(r.user.role!=='ADMIN')throw Error('يلزم حساب مدير النظام العام');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await init();}catch(x){msg(x.message)}};
async function init(){[catalog,matrix,organization]=await Promise.all([api('/access/catalog'),api('/access/matrix'),api('/access/organization')]);render('matrix')}
$('#app').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.page)};
function render(page){let c=$('#content');if(page==='matrix'){let roles=matrix.roles.filter(r=>r.key!=='ADMIN');c.innerHTML=`<div class="card"><h2>مصفوفة الصلاحيات التفصيلية</h2><p class="muted">يتم منح الصلاحيات لكل دور وظيفي. مدير النظام العام يحتفظ بالصلاحيات الشاملة. احفظ التغييرات لتطبيقها على واجهات API.</p><div class="tablewrap"><table><thead><tr><th>الإدارة / الوظيفة</th>${roles.map(r=>`<th>${r.nameAr}</th>`).join('')}</tr></thead><tbody>${catalog.permissions.map((p,i)=>{let prev=i?catalog.permissions[i-1].group:'';return `${prev!==p.group?`<tr class="group"><td colspan="${roles.length+1}">${p.group}</td></tr>`:''}<tr><td title="${p.key}">${p.key}</td>${roles.map(r=>`<td class="perm"><input type="checkbox" data-role="${r.key}" data-perm="${p.key}" ${matrix.matrix[r.key]?.[p.key]?'checked':''}></td>`).join('')}</tr>`}).join('')}</tbody></table></div><p><button id="saveMatrix" class="primary">حفظ مصفوفة الصلاحيات</button></p></div>`;$('#saveMatrix').onclick=saveMatrix}
if(page==='org'){c.innerHTML=`<div class="card"><h2>الهيكل الإداري للمنصة</h2><p class="muted">يمكن تعديل أسماء الإدارات والمدير المسؤول والوظائف. هذا سجل تنظيمي؛ إسناد حسابات المستخدمين إلى الإدارات يتطلب ربطاً تنظيمياً منفصلاً.</p><div id="departments">${organization.departments.map((d,i)=>`<div class="card dept"><div class="grid"><label>رمز الإدارة<input data-i="${i}" data-k="code" value="${esc(d.code)}"></label><label>اسم الإدارة<input data-i="${i}" data-k="nameAr" value="${esc(d.nameAr)}"></label><label>المدير المسؤول<input data-i="${i}" data-k="manager" value="${esc(d.manager||'')}"></label><label>نشطة<select data-i="${i}" data-k="active"><option value="true" ${d.active!==false?'selected':''}>نعم</option><option value="false" ${d.active===false?'selected':''}>لا</option></select></label><label style="grid-column:1/-1">المهام (افصل بينها بفاصلة)<input data-i="${i}" data-k="functions" value="${esc((d.functions||[]).join('، '))}"></label></div></div>`).join('')}</div><button id="saveOrg" class="primary">حفظ الهيكل الإداري</button></div><div class="card"><h3>إضافة مسمى وظيفي</h3><form id="positionForm" class="grid"><label>رمز المسمى<input name="code" required></label><label>المسمى الوظيفي<input name="nameAr" required></label><label>الإدارة<select name="departmentCode">${organization.departments.map(d=>`<option value="${esc(d.code)}">${esc(d.nameAr)}</option>`).join('')}</select></label><label>الوصف<input name="description"></label><button class="primary">إضافة</button></form><div id="positions">${organization.positions.map(p=>`<p>${esc(p.nameAr)} — ${esc(p.departmentCode)} (${esc(p.code)})</p>`).join('')}</div></div>`;$('#saveOrg').onclick=saveOrg;$('#positionForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));organization.positions.push(d);render('org')}}
if(page==='roles'){c.innerHTML=`<div class="card"><h2>الأدوار والمسؤوليات</h2>${catalog.roles.map(r=>`<div class="card"><h3>${esc(r.nameAr)} (${r.key})</h3><p>${esc(r.description)}</p><p>عدد الصلاحيات الممنوحة: ${r.key==='ADMIN'?'جميع الصلاحيات':Object.values(matrix.matrix[r.key]||{}).filter(Boolean).length}</p></div>`).join('')}</div>`}}
async function saveMatrix(){let changes=[...document.querySelectorAll('[data-role][data-perm]')].map(e=>({role:e.dataset.role,permission:e.dataset.perm,allowed:e.checked}));try{let r=await api('/access/matrix',{method:'PUT',body:{changes}});msg(r.message);matrix=await api('/access/matrix')}catch(e){msg(e.message)}}
async function saveOrg(){let departments=organization.departments.map((d,i)=>{let o={...d};document.querySelectorAll(`[data-i="${i}"]`).forEach(e=>{let k=e.dataset.k;o[k]=k==='active'?e.value==='true':k==='functions'?e.value.split(/[،,]/).map(x=>x.trim()).filter(Boolean):e.value});return o});try{organization=await api('/access/organization',{method:'PUT',body:{departments,positions:organization.positions}});msg('تم حفظ الهيكل الإداري')}catch(e){msg(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
