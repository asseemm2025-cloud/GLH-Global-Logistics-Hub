function updateClientAuthUI(){let b=document.getElementById('clientAuthBtn'),st=document.getElementById('clientAuthStatus');if(!b)return;b.textContent=currentClientUser?'تسجيل الخروج':'دخول العميل';b.onclick=currentClientUser?logoutClient:()=>openClientAuth();if(st)st.textContent=currentClientUser?'مرحباً، '+currentClientUser.username:'التصفح متاح كزائر';}
function openClientAuth(message=''){openModal('حساب العميل وتسجيل الدخول',`${message?`<div class="note">${esc(message)}</div>`:''}<div class="client-top"><button type="button" onclick="showAuthTab('login')">تسجيل الدخول</button><button type="button" onclick="showAuthTab('register')">إنشاء حساب جديد</button></div><div id="authForm"><h3>تسجيل الدخول</h3><div class="formgrid"><div><label>اسم المستخدم</label><input id="authUsername" autocomplete="username"></div><div><label>كلمة المرور</label><input id="authPassword" type="password" autocomplete="current-password"></div><div class="full"><button class="btn teal" onclick="loginClient()">دخول وتنفيذ العمليات</button></div></div></div><div class="note">يمكن تصفح المنصة دون تسجيل دخول. يلزم الحساب لإرسال طلب أو شراء أو طلب تمويل. هذه مصادقة تجريبية محلية وليست مناسبة لحسابات حقيقية قبل بناء خادم آمن.</div>`)}
function showAuthTab(tab){let el=document.getElementById('authForm');if(!el)return;el.innerHTML=tab==='register'?`<h3>إنشاء حساب عميل</h3><div class="formgrid"><div><label>اسم المستخدم</label><input id="authUsername" autocomplete="username"></div><div><label>كلمة المرور (8 أحرف على الأقل)</label><input id="authPassword" type="password" autocomplete="new-password"></div><div><label>الاسم الكامل</label><input id="authFullName"></div><div><label>رقم الهاتف</label><input id="authPhone"></div><div class="full"><label>البريد الإلكتروني</label><input id="authEmail" type="email"></div><div class="full"><button class="btn teal" onclick="registerClient()">إنشاء الحساب</button></div></div>`:`<h3>تسجيل الدخول</h3><div class="formgrid"><div><label>اسم المستخدم</label><input id="authUsername" autocomplete="username"></div><div><label>كلمة المرور</label><input id="authPassword" type="password" autocomplete="current-password"></div><div class="full"><button class="btn teal" onclick="loginClient()">دخول وتنفيذ العمليات</button></div></div>`}
function demoPasswordHash(v){let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return 'demo-'+(h>>>0).toString(16)}
function registerClient(){let username=document.getElementById('authUsername').value.trim(),password=document.getElementById('authPassword').value,fullName=document.getElementById('authFullName').value.trim(),phone=document.getElementById('authPhone').value.trim();if(!username||password.length<8||!fullName||!phone)return toast('أدخل البيانات المطلوبة وكلمة مرور لا تقل عن 8 أحرف');if(db.clientUsers.some(x=>x.username.toLowerCase()===username.toLowerCase()))return toast('اسم المستخدم مستخدم مسبقاً');let u={id:'USR-'+Date.now(),username,passwordHash:demoPasswordHash(password),fullName,phone,email:document.getElementById('authEmail').value.trim(),createdAt:new Date().toISOString()};db.clientUsers.push(u);currentClientUser={id:u.id,username:u.username,fullName:u.fullName};try{localStorage.setItem('glh_client_session',u.id)}catch(e){}closeModal();save();updateClientAuthUI();toast('تم إنشاء الحساب التجريبي وتسجيل الدخول')}
function loginClient(){let username=document.getElementById('authUsername').value.trim(),password=document.getElementById('authPassword').value,u=db.clientUsers.find(x=>x.username.toLowerCase()===username.toLowerCase()&&x.passwordHash===demoPasswordHash(password));if(!u)return toast('اسم المستخدم أو كلمة المرور غير صحيحة');currentClientUser={id:u.id,username:u.username,fullName:u.fullName};try{localStorage.setItem('glh_client_session',u.id)}catch(e){}closeModal();updateClientAuthUI();toast('تم تسجيل الدخول')}
function logoutClient(){currentClientUser=null;try{localStorage.removeItem('glh_client_session')}catch(e){}updateClientAuthUI();toast('تم تسجيل الخروج؛ يمكنك مواصلة التصفح كزائر')}
function requireClientLogin(action){if(!currentClientUser){openClientAuth('سجّل الدخول أولاً لتنفيذ '+action+'. التصفح متاح دون حساب.');return false}return true}

function addFinancingProduct(){let name=document.getElementById('finProdName').value.trim();if(!name)return toast('أدخل اسم منتج التمويل');db.financingProducts.push({name,type:document.getElementById('finProdType').value,min:+document.getElementById('finProdMin').value||0,max:+document.getElementById('finProdMax').value||0,term:+document.getElementById('finProdTerm').value||0,rate:+document.getElementById('finProdRate').value||0,eligibility:document.getElementById('finProdEligibility').value,documents:document.getElementById('finProdDocs').value,active:true});save();toast('تمت إضافة منتج التمويل')}
function manageFinancing(i){let x=db.financingRequests[i];openModal('دراسة طلب التمويل '+x.id,`<p><b>العميل:</b> ${esc(x.customer)} · ${esc(x.contact)}</p><p><b>الطلب المرتبط:</b> ${esc(x.requestId)} · <b>المنتج:</b> ${esc(x.product)}</p><p><b>المبلغ:</b> ${esc(x.amount)} · <b>المدة:</b> ${esc(x.term)} يوم · <b>الغرض:</b> ${esc(x.purpose)}</p><p><b>النشاط:</b> ${esc(x.business||'—')} · <b>المبيعات الشهرية:</b> ${esc(x.monthlySales||0)} · <b>سنوات النشاط:</b> ${esc(x.years||0)} · <b>الضمانات:</b> ${esc(x.guarantee||'—')}</p><div class="note">تحديث الحالة هنا لا يمثل موافقة ائتمانية أو صرف تمويل حقيقي.</div><label>حالة الطلب</label><select id="finStatus">${['طلب تمويل جديد','قيد استكمال المستندات','قيد الدراسة الائتمانية','مؤهل مبدئياً','موافقة مبدئية مشروطة','مرفوض','ملغي','تم الإغلاق'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select><div class="formgrid"><div><label>المبلغ الموافق عليه مبدئياً</label><input id="finApprovedAmount" type="number" value="${esc(x.approvedAmount||x.amount||0)}"></div><div><label>الهامش / الرسوم %</label><input id="finApprovedRate" type="number" step="0.01" value="${esc(x.approvedRate||0)}"></div><div><label>عدد الأقساط</label><input id="finInstallments" type="number" value="${esc(x.installments||1)}"></div><div><label>تصنيف المخاطر</label><select id="finRisk"><option>غير مصنف</option><option>منخفض</option><option>متوسط</option><option>مرتفع</option></select></div><div class="full"><label>الضمانات والشروط</label><input id="finConditions" value="${esc(x.conditions||x.guarantee||'')}"></div><div class="full"><label>ملاحظات الإدارة</label><textarea id="finAdminNote">${esc(x.adminNote||'')}</textarea></div></div><p><button class="btn teal" onclick="saveFinancingStatus(${i})">حفظ تحديث التمويل</button></p>`)}
function saveFinancingStatus(i){db.financingRequests[i].status=document.getElementById('finStatus').value;db.financingRequests[i].adminNote=document.getElementById('finAdminNote').value;db.financingRequests[i].approvedAmount=Number(document.getElementById('finApprovedAmount').value)||0;db.financingRequests[i].approvedRate=Number(document.getElementById('finApprovedRate').value)||0;db.financingRequests[i].installments=Number(document.getElementById('finInstallments').value)||1;db.financingRequests[i].risk=document.getElementById('finRisk').value;db.financingRequests[i].conditions=document.getElementById('finConditions').value;let req=db.requests.find(r=>r.id===db.financingRequests[i].requestId);if(req)req.financeStatus=db.financingRequests[i].status;closeModal();save();toast('تم تحديث طلب التمويل')}
function orderActionButtons(r){let role=orderRoleCurrent||'مدير النظام';let perms={ 'مدير النظام':['view','edit','approve','reject','delete'],'موظف عمليات':['view','edit','approve'],'موظف مالي':['view','approve'],'مراقب / قراءة فقط':['view']}[role]||['view'];let a=[];if(perms.includes('view'))a.push(`<button class="btn light sm" title="عرض" aria-label="عرض" onclick="showRequestDetails('${r.id}')">👁️</button>`);if(perms.includes('edit'))a.push(`<button class="btn light sm" title="تعديل" aria-label="تعديل" onclick="editOrder('${r.id}')">✏️</button>`);if(perms.includes('approve'))a.push(`<button class="btn light sm" title="اعتماد" aria-label="اعتماد" onclick="quickOrderStatus('${r.id}','تم التأكيد')">✓</button>`);if(perms.includes('reject'))a.push(`<button class="btn light sm" title="رفض" aria-label="رفض" onclick="quickOrderStatus('${r.id}','مرفوض')">✕</button>`);if(perms.includes('delete'))a.push(`<button class="btn red sm" title="حذف" aria-label="حذف" onclick="deleteOrder('${r.id}')">🗑️</button>`);return a.join(' ')||'—'}
function quickOrderStatus(id,status){let r=db.requests.find(x=>x.id===id);if(!r)return;r.status=status;r.note=status==='مرفوض'?'تم رفض الطلب بعد المراجعة.':'تم تأكيد الطلب.';save();toast('تم تحديث حالة الطلب')}
function deleteOrder(id){if(!confirm('حذف الطلب التجريبي '+id+'؟'))return;db.requests=db.requests.filter(x=>x.id!==id);db.financingRequests=db.financingRequests.filter(x=>x.requestId!==id);save();toast('تم حذف الطلب التجريبي')}

function buyProduct(i){if(!requireClientLogin('شراء المنتج'))return;let p=db.products[i];if(!p||!p.active)return;openModal('طلب منتج من السوق الإلكتروني',`<div class="note">${esc(p.name)} · ${esc(p.store)} · السعر ${esc(p.price)} ${esc(p.currency)} للوحدة. الطلب تجريبي ولا ينفذ عملية دفع فعلية.</div><div class="formgrid"><div><label>اسم العميل *</label><input id="ecName"></div><div><label>رقم الهاتف *</label><input id="ecPhone"></div><div><label>الدولة *</label><input id="ecCountry" value="اليمن"></div><div><label>المدينة والعنوان *</label><input id="ecAddress"></div><div><label>الكمية *</label><input id="ecQty" type="number" min="1" max="${Math.max(1,p.stock)}" value="1" oninput="updateEcomTotal(${i})"></div><div><label>وسيلة الدفع</label><select id="ecPayment">${db.payments.filter(x=>x.active).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label>طريقة الاستلام</label><select id="ecDelivery"><option>توصيل إلى العنوان</option><option>استلام من المتجر</option><option>شحن إلى دولة أخرى</option></select></div><div><label>ملاحظات</label><input id="ecNotes"></div><div class="full"><b id="ecTotal">الإجمالي: ${esc(p.price)} ${esc(p.currency)}</b></div><div class="full"><button class="btn teal" onclick="submitEcomOrder(${i})">تأكيد الطلب وإرساله للمتجر والإدارة</button></div></div>`)}
function updateEcomTotal(i){let p=db.products[i],q=Math.max(1,Number(document.getElementById('ecQty')?.value)||1);let t=document.getElementById('ecTotal');if(t)t.textContent='الإجمالي: '+(p.price*q).toFixed(2)+' '+p.currency}
function submitEcomOrder(i){if(!requireClientLogin('إرسال طلب الشراء'))return;let p=db.products[i],name=document.getElementById('ecName').value.trim(),phone=document.getElementById('ecPhone').value.trim(),country=document.getElementById('ecCountry').value.trim(),address=document.getElementById('ecAddress').value.trim(),qty=Math.max(1,Number(document.getElementById('ecQty').value)||1);if(!name||!phone||!country||!address)return toast('أكمل اسم العميل والهاتف والدولة والعنوان');if(qty>p.stock)return toast('الكمية المطلوبة أكبر من المخزون المتاح');let o={id:'EC-'+String(Date.now()).slice(-7),product:p.name,store:p.store,quantity:qty,unitPrice:p.price,total:Number((p.price*qty).toFixed(2)),currency:p.currency,customer:name,phone,country,address,paymentMethod:document.getElementById('ecPayment').value,delivery:document.getElementById('ecDelivery').value,notes:document.getElementById('ecNotes').value,clientUserId:currentClientUser?.id||'',status:'طلب جديد',paymentStatus:'بانتظار الدفع',createdAt:new Date().toISOString()};db.ecommerceOrders.unshift(o);p.stock-=qty;closeModal();save();toast('تم إرسال الطلب التجاري إلى الإدارة');clientPage('ecomOrders')}
let requestItemCount=0;function addRequestItem(){let box=document.getElementById('requestItems');if(!box)return;let n=++requestItemCount;let row=document.createElement('div');row.className='card';row.style.margin='9px 0';row.id='reqItem'+n;row.innerHTML=`<div class="section-title"><strong>المنتج رقم ${n}</strong><button type="button" class="btn red sm" onclick="this.closest('.card').remove()">حذف المنتج</button></div><div class="formgrid"><div><label>اسم المنتج / وصف البضاعة *</label><input class="ri-name" placeholder="اسم المنتج والمواصفات"></div><div><label>المورد / التاجر لهذا المنتج</label><input class="ri-supplier" placeholder="اسم المورد أو التاجر"></div><div><label>السعر للوحدة</label><input class="ri-price" type="number" min="0" step="0.01" placeholder="0.00"></div><div><label>العملة</label><select class="ri-currency"><option>USD</option><option>YER</option><option>SAR</option><option>EUR</option><option>CNY</option></select></div><div><label>الكمية المطلوبة *</label><input class="ri-qty" type="number" min="1" value="1"></div><div><label>وحدة القياس</label><select class="ri-unit"><option>قطعة</option><option>كرتون</option><option>طن</option><option>كجم</option><option>متر مكعب</option><option>حاوية</option><option>طرد</option><option>لتر</option></select></div><div class="full"><label>مواصفات / رابط / ملاحظات المنتج</label><input class="ri-spec" placeholder="المقاس، اللون، الموديل، الجودة، رابط المنتج..."></div></div>`;box.appendChild(row)}
function readRequestFiles(){let input=document.getElementById('cFiles'),files=[...(input?.files||[])];if(files.length>4)throw new Error('يسمح بأربعة مرفقات كحد أقصى في النموذج التجريبي');for(let f of files)if(f.size>512000)throw new Error('حجم الملف '+f.name+' أكبر من 500 كيلوبايت');return Promise.all(files.map(f=>new Promise((resolve,reject)=>{let rd=new FileReader();rd.onload=()=>resolve({name:f.name,type:f.type,size:f.size,data:rd.result});rd.onerror=()=>reject(new Error('تعذر قراءة المرفق '+f.name));rd.readAsDataURL(f)})))}
async function createRequest(){if(!currentClientUser){openClientAuth('يجب تسجيل الدخول قبل إرسال الطلب أو تنفيذ أي عملية. يمكنك مواصلة التصفح كزائر.');return}let name=document.getElementById('cName').value.trim(),contact=document.getElementById('cContact').value.trim(),from=document.getElementById('cFrom').value.trim(),to=document.getElementById('cTo').value.trim(),country=document.getElementById('cCountry').value.trim(),origin=document.getElementById('cOriginCountry').value.trim(),dest=document.getElementById('cDestCountry').value.trim();let scope=document.getElementById('cScope').value;if(scope==='local'){if(!name||!contact||!from||!to||!country){toast('أكمل اسم العميل والهاتف والبلد وموقعي الاستلام والتسليم');return}origin=country;dest=country}else if(!name||!contact||!from||!to||!country||!origin||!dest){toast('أكمل بيانات العميل وبلدي المنشأ والوصول ومسار الشحن الدولي');return}if(!document.getElementById('cAgree').checked){toast('يرجى تأكيد صحة البيانات قبل الإرسال');return}let rows=[...document.querySelectorAll('#requestItems .card')].map(row=>({product:row.querySelector('.ri-name').value.trim(),supplier:row.querySelector('.ri-supplier').value.trim(),unitPrice:Number(row.querySelector('.ri-price').value)||0,currency:row.querySelector('.ri-currency').value,quantity:Number(row.querySelector('.ri-qty').value)||0,unit:row.querySelector('.ri-unit').value,specifications:row.querySelector('.ri-spec').value.trim()}));if(!rows.length||rows.some(x=>!x.product||x.quantity<1)){toast('أدخل اسم وكمية صحيحة لكل منتج');return}if(document.getElementById('cPayment').value==='تمويل'){let amt=Number(document.getElementById('cFinanceAmount').value)||0;if(amt<=0){toast('أدخل مبلغ التمويل المطلوب');return}let fp=(db.financingProducts||[]).find(x=>x.name===document.getElementById('cFinanceProduct').value&&x.active);if(fp&&(amt<fp.min||amt>fp.max)){toast('مبلغ التمويل خارج حدود المنتج المحدد ('+fp.min+' - '+fp.max+')');return}}let files;try{files=await readRequestFiles()}catch(e){toas function addEcomStore(){let name=document.getElementById('ecStoreName').value.trim();if(!name)return toast('أدخل اسم المتجر');if(db.stores.some(x=>x.name===name))return toast('اسم المتجر موجود مسبقاً');db.stores.push({name,trader:document.getElementById('ecTrader').value.trim(),category:document.getElementById('ecStoreType').value.trim(),city:document.getElementById('ecStoreCity').value.trim(),phone:document.getElementById('ecStorePhone').value.trim(),email:document.getElementById('ecStoreEmail').value.trim(),description:document.getElementById('ecStoreDesc').value.trim(),active:true});save();toast('تم تسجيل المتجر ونشره في واجهة العميل')}
function addEcomCategory(){let n=document.getElementById('ecCatName').value.trim();if(!n)return toast('أدخل اسم التصنيف');db.ecomCategories.push({name:n,active:true});save();toast('تمت إضافة التصنيف')}
function addEcomProduct(){let name=document.getElementById('ecProdName').value.trim();if(!name)return toast('أدخل اسم المنتج');db.products.push({name,store:document.getElementById('ecProdStore').value,category:document.getElementById('ecProdCat').value,price:Number(document.getElementById('ecProdPrice').value)||0,currency:document.getElementById('ecProdCurrency').value,stock:Number(document.getElementById('ecProdStock').value)||0,sku:document.getElementById('ecProdSku').value.trim(),description:document.getElementById('ecProdDesc').value.trim(),active:document.getElementById('ecProdStatus').value==='true'});save();toast('تم حفظ المنتج وتحديث واجهة السوق')}
function manageEcomOrder(i){let o=db.ecommerceOrders[i];openModal('إدارة الطلب التجاري '+o.id,`<div class="formgrid"><div><label>حالة الطلب</label><select id="eOrderStatus">${['طلب جديد','تم التأكيد','قيد التجهيز','جاهز للشحن','خرج للتوصيل','تم التسليم','ملغي','مرتجع'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>حالة الدفع</label><select id="ePayStatus">${['بانتظار الدفع','مدفوع','فشل الدفع','مسترد','الدفع عند الاستلام'].map(x=>`<option ${o.paymentStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>شركة التوصيل / رقم التتبع</label><input id="eDelivery" value="${esc(o.delivery||'')}"></div><div><label>ملاحظات للعميل</label><input id="eNote" value="${esc(o.adminNote||'')}"></div><div class="full"><button class="btn teal" onclick="saveEcomOrder(${i})">حفظ وإظهار التحديث للعميل</button></div></div>`)}
function saveEcomOrder(i){let o=db.ecommerceOrders[i];o.status=document.getElementById('eOrderStatus').value;o.paymentStatus=document.getElementById('ePayStatus').value;o.delivery=document.getElementById('eDelivery').value;o.adminNote=document.getElementById('eNote').value;closeModal();save();toast('تم تحديث الطلب التجاري')}
function addSwiftMessage(){let ref=document.getElementById('swRef').value.trim();if(!ref)return toast('أدخل مرجع العملية');if(db.swiftMessages.some(x=>x.ref===ref))return toast('المرجع مسجل مسبقاً');db.swiftMessages.unshift({ref,type:document.getElementById('swType').value,sender:document.getElementById('swSender').value,receiver:document.getElementById('swReceiver').value,beneficiary:document.getElementById('swBeneficiary').value,account:document.getElementById('swAccount').value,amount:Number(document.getElementById('swAmount').value)||0,currency:document.getElementById('swCurrency').value,valueDate:document.getElementById('swValueDate').value,purpose:document.getElementById('swPurpose').value,fee:Number(document.getElementById('swFee').value)||0,compliance:document.getElementById('swCompliance').value,details:document.getElementById('swDetails').value,status:'قيد المراجعة',createdAt:new Date().toISOString()});save();toast('تم حفظ سجل SWIFT التجريبي – لم يتم إرسال رسالة مصرفية')}
function addSwiftBank(){let name=document.getElementById('swBankName').value.trim(),bic=document.getElementById('swBankBic').value.trim();if(!name||!bic)return toast('أدخل اسم البنك ورمز BIC');db.swiftBanks.push({name,bic,country:document.getElementById('swBankCountry').value,currency:document.getElementById('swBankCurrency').value,active:true});save();toast('تمت إضافة البنك المراسل التجريبي')}
function manageSwift(i){let m=db.swiftMessages[i];openModal('مراجعة سجل SWIFT '+m.ref,`<p><b>${esc(m.type)}</b> · ${esc(m.amount)} ${esc(m.currency)}</p><p>${esc(m.sender)} ← ${esc(m.receiver)} · ${esc(m.beneficiary)}</p><p>الغرض: ${esc(m.purpose||'—')} · نتيجة فحص الامتثال: ${esc(m.compliance)}</p><div class="note">لا تعتمد أو ترسل أي تحويل حقيقي من هذه الواجهة التجريبية.</div><label>حالة سير العمل الداخلية</label><select id="swNewStatus">${['قيد المراجعة','معلق – امتثال','معلق – مستندات','معتمد داخلياً','مرفوض','تمت المطابقة'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select><p><button class="btn teal" onclick="saveSwiftStatus(${i})">حفظ الحالة</button></p>`)}
function saveSwiftStatus(i){db.swiftMessages[i].status=document.getElementById('swNewStatus').value;closeModal();save();toast('تم تحديث حالة السجل الداخلي')}
function addSector(){let n=document.getElementById('sectorName').value.trim();if(!n)return toast('أدخل اسم القطاع');db.sectors.push({name:n,departments:document.getElementById('sectorDepts').value.split(',').map(x=>x.trim()).filter(Boolean),services:document.getElementById('sectorServices').value.split(',').map(x=>x.trim()).filter(Boolean),active:true});save();toast('تمت إضافة القطاع')}
function addShipment(){let id=document.getElementById('shipId').value.trim();if(!id)return toast('أدخل رقم الشحنة');db.shipments.unshift({id,carrier:document.getElementById('shipCarrier').value,from:document.getElementById('shipFrom').value,to:document.getElementById('shipTo').value,stage:document.getElementById('shipStage').value,progress:Math.max(0,Math.min(100,Number(document.getElementById('shipProgress').value)||0)),active:true});save();toast('تمت إضافة حركة الشحنة')}
function addStore(){let name=document.getElementById('storeName').value.trim();if(!name)return toast('أدخل اسم المتجر');db.stores.push({name,trader:document.getElementById('storeTrader').value,category:document.getElementById('storeCat').value,city:document.getElementById('storeCity').value,active:true});save();toast('تمت إضافة المتجر')}
function addProduct(){let name=document.getElementById('prodName').value.trim();if(!name)return toast('أدخل اسم المنتج');db.products.push({name,store:document.getElementById('prodStore').value,category:document.getElementById('prodCat').value,price:Number(document.getElementById('prodPrice').value)||0,currency:document.getElementById('prodCurrency').value,stock:Number(document.getElementById('prodStock').value)||0,active:true});save();toast('تمت إضافة المنتج ونشره في واجهة العميل')}
function addInsurance(){let name=document.getElementById('insName').value.trim();if(!name)return toast('أدخل اسم الشركة');db.insurance.push({name,coverage:document.getElementById('insCoverage').value,territory:document.getElementById('insTerritory').value,contact:document.getElementById('insContact').value,active:true});save();toast('تمت إضافة شركة التأمين')}
function addRecord(s){let labels={services:['name','desc'],companies:['name','type','country'],locations:['name','type','country'],payments:['name','type','provider'],integrations:['name','type','endpoint','status'],delivery:['name','area','fee'],content:['name','type','status'],tools:['name','type'],users:['name','role','status']}[s];let x={active:true};labels.forEach((k,i)=>x[k]=document.getElementById(i===0?'newA':'newB'+(i-1)).value.trim());if(!x[labels[0]]){toast('أدخل اسم السجل');return}if(s==='integrations')x.active=false;db[s].push(x);save();toast('تمت إضافة السجل')}
function toggleRecord(s,i){db[s][i].active=!db[s][i].active;save()}function deleteRecord(s,i){if(confirm('هل تريد حذف هذا السجل؟')){db[s].splice(i,1);save()}}
function editOrder(id){let r=db.requests.find(x=>x.id===id);if(!r)return;openModal('إدارة الطلب '+id,`<div class="formgrid"><div class="full"><button class="btn light sm" onclick="closeModal();showRequestDetails('${id}')">عرض جميع بيانات العميل والمنتجات والمرفقات</button></div><div><label>قيمة عرض السعر (${esc(r.currency||db.settings.currency)})</label><input id="oPrice" type="number" value="${r.price||''}"></div><div><label>حالة الطلب</label><select id="oStatus">${['طلب جديد','قيد المراجعة','عرض سعر مرسل','تم التأكيد','قيد التنفيذ','مكتمل','مرفوض'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>شركة التوصيل</label><select id="oDelivery"><option>${esc(r.delivery||'غير محدد')}</option>${db.delivery.filter(x=>x.active).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label>حالة التتبع</label><select id="oTrack">${['لم يبدأ','تم استلام الشحنة','في المستودع','في الطريق','وصلت إلى الوجهة','خرجت للتسليم','تم التسليم'].map(x=>`<option ${r.track===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>حالة الدفع</label><select id="oPay">${['غير مدفوع','بانتظار التأكيد','مدفوع','مسترد'].map(x=>`<option ${r.payStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>وسيلة الدفع</label><select id="oMethod">${db.payments.map(x=>`<option ${r.paymentMethod===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="full"><label>ملاحظة تظهر للعميل</label><textarea id="oNote">${esc(r.note||'')}</textarea></div><div class="full"><button class="btn teal" onclick="saveOrder('${id}')">حفظ وإشعار العميل</button></div></div>`)}
function saveOrder(id){let r=db.requests.find(x=>x.id===id);r.price=Number(document.getElementById('oPrice').value)||0;r.status=document.getElementById('oStatus').value;r.delivery=document.getElementById('oDelivery').value;r.track=document.getElementById('oTrack').value;r.payStatus=document.getElementById('oPay').value;r.paymentMethod=document.getElementById('oMethod').value;r.note=document.getElementById('oNote').value;closeModal();save();toast('تم تحديث الطلب وانعكست التغييرات في واجهة العميل')}
function saveSettings(){db.settings={...db.settings,platformName:document.getElementById('setName').value,currency:document.getElementById('setCurrency').value,language:document.getElementById('setLang').value,country:document.getElementById('setCountry').value,commission:Number(document.getElementById('setCommission').value)||0};save();toast('تم حفظ إعدادات المنصة')}
function exportCSV(){let rows=[['ID','Customer','Service','From','To','Price','Status','Payment'],...db.requests.map(r=>[r.id,r.name,r.service,r.from,r.to,r.price,r.status,r.payStatus])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='GLH_Orders.csv';a.click();URL.revokeObjectURL(a.href)}
function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});async function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else toast('للتثبيت: افتح قائمة المتصفح ثم اختر إضافة إلى الشاشة الرئيسية')}
